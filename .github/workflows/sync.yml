name: sync-schedule

on:
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 6 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full | hot'
        default: 'full'

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: collect
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              '*/15 * * * *') MODE=hot ;;
              *) MODE=full ;;
            esac
          fi
          if [ "$MODE" = "full" ]; then pip install --quiet pillow; fi
          python collector/collect.py --mode "$MODE"
      - name: commit if changed
        run: |
          git config user.name  "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data assets/logos
          git diff --cached --quiet || (git commit -m "sync schedule" && git pull --rebase && git push)
