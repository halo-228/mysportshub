name: sync-schedule

on:
  schedule:
    - cron: '0 18 * * *'      # 03:00 KST 전체 일정
    - cron: '0 6 * * *'       # 15:00 KST 전체 일정
    - cron: '*/10 * * * *'    # 경기 중·직전 경기 확인 → 있으면 3분 간격으로 계속 갱신, 없으면 몇 초 만에 종료
  workflow_dispatch:
    inputs:
      mode:
        description: 'full | hot'
        default: 'full'

permissions:
  contents: write

concurrency:
  group: sync-${{ (github.event.schedule == '*/10 * * * *' || inputs.mode == 'hot') && 'hot' || 'full' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 수집
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "*/10 * * * *" ]; then MODE=hot; else MODE=full; fi
          fi
          bash collector/run.sh "$MODE"
